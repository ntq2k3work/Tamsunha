name: tamsunha-local

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in server/.env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in server/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in server/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in server/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - tamsunha_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  tamsunha_mysql_data:
    name: tamsunha_mysql_data
